<svg
  width="600"
  height="200"
  viewBox="0 0 600 200"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Wasleen Liminal Approval Consultants logo"
>
  <title>Wasleen Liminal Approval Consultants</title>

  <!-- ===== ICON (200x200 viewBox, unchanged) ===== -->
  <g transform="translate(0,0)">
    <!-- Badge frame — brand blue (#004080) -->
    <rect
      x="15" y="15" width="170" height="170" rx="32"
      fill="none" stroke="#004080" stroke-width="5"
    />
    <!-- Outer wall boundary — brand blue (#004080) -->
    <path
      d="M50,50 L150,50 L150,100 L115,100 L115,150 L50,150"
      fill="none" stroke="#004080" stroke-width="6" stroke-linejoin="round"
    />
    <!-- Internal partition wall — black (#000000) -->
    <line x1="90" y1="50" x2="90" y2="100" stroke="#000000" stroke-width="4" />
    <!-- Door leaf + swing arc — UAE red (#C8102E) -->
    <line x1="65" y1="150" x2="65" y2="130" stroke="#C8102E" stroke-width="4" />
    <path
      d="M65,130 A20,20 0 0 1 85,150"
      fill="none" stroke="#C8102E" stroke-width="2.5"
    />
    <!-- Window breaks — UAE green (#00843D) -->
    <line x1="120" y1="45" x2="120" y2="55" stroke="#00843D" stroke-width="3" />
    <line x1="130" y1="45" x2="130" y2="55" stroke="#00843D" stroke-width="3" />
  </g>

  <!-- ===== TEXT WORDMARK ===== -->
  <g transform="translate(220, 0)">
    <!-- "WASLEEN LIMINAL" — first line -->
    <text
      x="0" y="85"
      font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
      font-size="48"
      font-weight="800"
      letter-spacing="0.5"
    >
      <tspan fill="#C8102E">WASLEEN </tspan>
      <tspan fill="#00843D">LIMINAL</tspan>
    </text>

    <!-- "APPROVAL CONSULTANTS" — second line -->
    <text
      x="0" y="125"
      font-family="Montserrat, 'Segoe UI', Arial, sans-serif"
      font-size="24"
      font-weight="700"
      fill="#000000"
      letter-spacing="3"
    >
      APPROVAL CONSULTANTS
    </text>
  </g>
</svg>
